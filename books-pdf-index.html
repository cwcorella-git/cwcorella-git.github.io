<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books PDF Index</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
            color: #e0e0e0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            font-size: 0.95rem;
            color: #aaa;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.5rem;
            color: #fff;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        input[type="text"],
        select {
            padding: 0.75rem 1rem;
            border: 1px solid #444;
            background: #2a2a3e;
            color: #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
        }

        input[type="text"]::placeholder {
            color: #777;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #666;
            background: #333;
        }

        button {
            padding: 0.75rem 1.5rem;
            background: #444;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #555;
            border-color: #666;
        }

        .view-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .view-btn {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .view-btn.active {
            background: #666;
            border-color: #777;
        }

        .results-info {
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: #aaa;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .books-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .book {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .book:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #666;
        }

        .book-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .book-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #aaa;
        }

        .book-author {
            color: #bbb;
        }

        .book-year {
            color: #999;
        }

        .pdfs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .pdf-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            text-decoration: none;
            color: #64b5f6;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .pdf-link:hover {
            background: rgba(0, 0, 0, 0.4);
            color: #90caf9;
        }

        .pdf-source {
            font-size: 0.8rem;
            color: #999;
            margin-right: auto;
        }

        .pdf-notes {
            font-size: 0.8rem;
            color: #888;
            font-style: italic;
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .author-group {
            margin-bottom: 2rem;
        }

        .author-header {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #444;
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
            }

            input[type="text"],
            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Books PDF Index</h1>
            <div class="stats">
                <div class="stat">
                    <span>Total Books</span>
                    <span class="stat-value" id="total-books">0</span>
                </div>
                <div class="stat">
                    <span>Total Links</span>
                    <span class="stat-value" id="total-links">0</span>
                </div>
                <div class="stat">
                    <span>Unique Authors</span>
                    <span class="stat-value" id="unique-authors">0</span>
                </div>
            </div>
        </header>

        <div class="controls">
            <input
                type="text"
                id="search"
                placeholder="Search by title or author..."
                autocomplete="off"
            >
            <select id="source-filter">
                <option value="">All Sources</option>
                <option value="Internet Archive">Internet Archive</option>
                <option value="The Anarchist Library">Anarchist Library</option>
                <option value="Project Gutenberg">Project Gutenberg</option>
                <option value="Marxists Internet Archive">Marxists Archive</option>
                <option value="LibCom">LibCom</option>
            </select>
            <button onclick="resetFilters()">Reset</button>
        </div>

        <div class="view-controls">
            <button class="view-btn active" onclick="setView('grid')">Grid</button>
            <button class="view-btn" onclick="setView('list')">List</button>
            <button class="view-btn" onclick="setView('author')">By Author</button>
        </div>

        <div class="results-info">
            Showing <span id="results-count">0</span> books
        </div>

        <div id="grid-view" class="books-grid"></div>
        <div id="list-view" class="books-list" style="display: none;"></div>
        <div id="author-view" style="display: none;"></div>
    </div>

    <script>
        let allBooks = [];
        let currentView = 'grid';

        async function loadBooks() {
            try {
                const response = await fetch('books-pdf-sources-expanded.json');
                allBooks = await response.json();
                updateStats();
                render();
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('grid-view').innerHTML =
                    '<div class="no-results">Error loading books. Make sure books-pdf-sources-expanded.json is in the same directory.</div>';
            }
        }

        function updateStats() {
            const totalLinks = allBooks.reduce((sum, book) => sum + (book.pdfs?.length || 0), 0);
            const authors = new Set(allBooks.map(b => b.author));

            document.getElementById('total-books').textContent = allBooks.length;
            document.getElementById('total-links').textContent = totalLinks;
            document.getElementById('unique-authors').textContent = authors.size;
        }

        function getFilteredBooks() {
            const search = document.getElementById('search').value.toLowerCase();
            const source = document.getElementById('source-filter').value;

            return allBooks.filter(book => {
                const matchesSearch = !search ||
                    book.title.toLowerCase().includes(search) ||
                    book.author.toLowerCase().includes(search);

                const matchesSource = !source ||
                    book.pdfs.some(pdf => pdf.source === source);

                return matchesSearch && matchesSource;
            });
        }

        function formatBook(book) {
            return `
                <div class="book">
                    <div class="book-title">${escapeHtml(book.title)}</div>
                    <div class="book-meta">
                        <span class="book-author">${escapeHtml(book.author)}</span>
                        <span class="book-year">${book.year}</span>
                    </div>
                    <div class="pdfs">
                        ${book.pdfs.map(pdf => `
                            <a href="${pdf.url}" target="_blank" class="pdf-link">
                                <span class="pdf-source">${pdf.source}</span>
                                <span class="pdf-notes">${pdf.notes || 'PDF'}</span>
                                <span style="margin-left: auto;">→</span>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderGrid(books) {
            document.getElementById('grid-view').innerHTML = books.length > 0
                ? books.map(formatBook).join('')
                : '<div class="no-results">No books found</div>';
        }

        function renderList(books) {
            document.getElementById('list-view').innerHTML = books.length > 0
                ? books.map(formatBook).join('')
                : '<div class="no-results">No books found</div>';
        }

        function renderByAuthor(books) {
            const byAuthor = {};
            books.forEach(book => {
                if (!byAuthor[book.author]) {
                    byAuthor[book.author] = [];
                }
                byAuthor[book.author].push(book);
            });

            const html = Object.keys(byAuthor).sort().map(author => `
                <div class="author-group">
                    <div class="author-header">${escapeHtml(author)} (${byAuthor[author].length})</div>
                    ${byAuthor[author].map(formatBook).join('')}
                </div>
            `).join('');

            document.getElementById('author-view').innerHTML = html;
        }

        function render() {
            const filtered = getFilteredBooks();
            document.getElementById('results-count').textContent = filtered.length;

            document.getElementById('grid-view').style.display = currentView === 'grid' ? 'grid' : 'none';
            document.getElementById('list-view').style.display = currentView === 'list' ? 'flex' : 'none';
            document.getElementById('author-view').style.display = currentView === 'author' ? 'block' : 'none';

            if (currentView === 'grid') {
                renderGrid(filtered);
            } else if (currentView === 'list') {
                renderList(filtered);
            } else {
                renderByAuthor(filtered);
            }
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('source-filter').value = '';
            render();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('search').addEventListener('input', render);
        document.getElementById('source-filter').addEventListener('change', render);

        loadBooks();
    </script>
</body>
</html>
