<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// First paint (2026-10-22): before anything mounts, paint the colour the
			// garden last averaged (Garden.svelte, cwc-paint-bg) and the text and glass
			// Sky.svelte last set (cwc-paint-vars), so a reload does not flash the
			// default theme. Older than two hours, or none yet: a guess from the hour.
			(function () {
				var r = document.documentElement, now = Date.now(), FRESH = 2 * 3600e3;
				function read(k) { try { var v = JSON.parse(localStorage.getItem(k)); return v && now - v.at < FRESH ? v : null; } catch (e) { return null; } }
				var bg = read('cwc-paint-bg'), vars = read('cwc-paint-vars');
				var rgb = bg && bg.rgb;
				if (!rgb) {
					var h = new Date().getHours() + new Date().getMinutes() / 60;
					rgb = h < 5.5 || h >= 20 ? [16, 20, 34] : h < 7 || h >= 18.5 ? [92, 78, 96] : [118, 138, 158];
				}
				var c = 'rgb(' + rgb.join(',') + ')';
				r.style.setProperty('--body-bg', c);
				r.style.background = 'var(--body-bg)';
				if (vars) {
					for (var k in vars.vars) if (vars.vars[k]) r.style.setProperty(k, vars.vars[k]);
				} else {
					var lum = 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
					r.style.setProperty('--clr-text', lum < 110 ? 'rgb(240,236,226)' : 'rgb(14,16,22)');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
